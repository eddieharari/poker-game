<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, #12141D 0%, #0B0C10 100%);
    font-family: 'Inter', sans-serif;
    color: #E0E6ED;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background */
  .bg-glow {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 600px 400px at 30% 30%, rgba(255,215,0,0.05), transparent),
      radial-gradient(ellipse 500px 500px at 70% 60%, rgba(255,107,0,0.04), transparent);
    animation: bgShift 8s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Floating card suits */
  .suits {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; overflow: hidden;
  }
  .suit {
    position: absolute;
    font-size: 48px;
    opacity: 0.04;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.04; }
    90%  { opacity: 0.04; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .container {
    position: relative; z-index: 1;
    text-align: center;
  }

  .card-icon {
    font-size: 64px;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.3));
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(255,215,0,0.3);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 20px;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .channel {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 32px;
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 16px;
    background: rgba(255,215,0,0.05);
  }

  .channel .live-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #FF3333;
    box-shadow: 0 0 10px #FF3333;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .channel .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 2px;
  }

  .countdown {
    margin-top: 40px;
    font-size: 14px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  .countdown .time {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    display: block;
    margin-top: 8px;
  }

  .platforms {
    margin-top: 32px;
    display: flex; gap: 12px; justify-content: center;
  }
  .platforms .badge {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="suits" id="suits"></div>

  <div class="container">
    <div class="card-icon">&#9824;</div>
    <h1>Starting Soon</h1>
    <p class="subtitle">Poker Session</p>

    <div class="channel">
      <div class="live-dot"></div>
      <span class="name">viviputz</span>
    </div>

    <div class="countdown">
      STREAM STARTS IN
      <span class="time" id="countdown">5:00</span>
    </div>

    <div class="platforms">
      <span class="badge">ClubGG</span>
      <span class="badge">GGPoker</span>
    </div>
  </div>

<script>
  // Floating suits
  const suits = ['\u2660', '\u2665', '\u2666', '\u2663'];
  const container = document.getElementById('suits');
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'suit';
    el.textContent = suits[i % 4];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (30 + Math.random() * 40) + 'px';
    el.style.animationDuration = (15 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(el);
  }

  // Countdown (default 5 min, configurable via ?minutes=X)
  const params = new URLSearchParams(window.location.search);
  let totalSeconds = (parseInt(params.get('minutes') || '5', 10)) * 60;

  function updateCountdown() {
    if (totalSeconds <= 0) {
      document.getElementById('countdown').textContent = 'NOW!';
      return;
    }
    totalSeconds--;
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    document.getElementById('countdown').textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
