<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, #12141D 0%, #0B0C10 100%);
    font-family: 'Inter', sans-serif;
    color: #E0E6ED;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-glow {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 600px 400px at 50% 40%, rgba(255,51,102,0.04), transparent),
      radial-gradient(ellipse 400px 300px at 40% 60%, rgba(255,215,0,0.03), transparent);
  }

  .container {
    position: relative; z-index: 1;
    text-align: center;
  }

  .icon { font-size: 56px; margin-bottom: 20px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(255,215,0,0.25);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 18px;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
    letter-spacing: 1.5px;
    margin-bottom: 40px;
  }

  .stats {
    display: flex; gap: 32px; justify-content: center;
    margin-bottom: 40px;
  }

  .stat {
    text-align: center;
    padding: 16px 24px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    background: rgba(255,255,255,0.02);
    min-width: 100px;
  }

  .stat .label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 6px;
  }

  .stat .value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700;
  }

  .stat .value.positive { color: #00FF9D; }
  .stat .value.negative { color: #FF3366; }
  .stat .value.neutral  { color: #E0E6ED; }

  .channel {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 28px;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 14px;
    background: rgba(255,215,0,0.04);
  }

  .channel .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 700;
    color: #FFD700; letter-spacing: 1.5px;
  }

  .follow {
    margin-top: 20px;
    font-size: 14px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="icon">&#127183;</div>
    <h1>Thanks for Watching</h1>
    <p class="subtitle">Session Complete</p>

    <div class="stats">
      <div class="stat">
        <div class="label">Hands</div>
        <div class="value neutral" id="hands">--</div>
      </div>
      <div class="stat">
        <div class="label">Result</div>
        <div class="value neutral" id="result">$0</div>
      </div>
      <div class="stat">
        <div class="label">Duration</div>
        <div class="value neutral" id="duration">--</div>
      </div>
    </div>

    <div class="channel">
      <span class="name">&#9824; viviputz</span>
    </div>

    <p class="follow">Follow for more poker sessions!</p>
  </div>

<script>
  // Update via URL params: ?hands=120&result=350&duration=2h30m
  const params = new URLSearchParams(window.location.search);

  if (params.get('hands')) {
    document.getElementById('hands').textContent = params.get('hands');
  }
  if (params.get('result')) {
    const val = parseInt(params.get('result'), 10);
    const el = document.getElementById('result');
    el.textContent = (val >= 0 ? '+$' : '-$') + Math.abs(val);
    el.className = 'value ' + (val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral');
  }
  if (params.get('duration')) {
    document.getElementById('duration').textContent = params.get('duration');
  }
</script>
</body>
</html>
