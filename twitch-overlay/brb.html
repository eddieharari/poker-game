<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, #12141D 0%, #0B0C10 100%);
    font-family: 'Inter', sans-serif;
    color: #E0E6ED;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-glow {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 500px 400px at 40% 50%, rgba(69,243,255,0.04), transparent),
      radial-gradient(ellipse 400px 300px at 60% 40%, rgba(255,215,0,0.03), transparent);
    animation: bgPulse 6s ease-in-out infinite alternate;
  }
  @keyframes bgPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

  .container {
    position: relative; z-index: 1;
    text-align: center;
  }

  .icon {
    font-size: 56px;
    margin-bottom: 20px;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: #45F3FF;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(69,243,255,0.3);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 18px;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
    letter-spacing: 1.5px;
  }

  .channel {
    margin-top: 40px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 28px;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 14px;
    background: rgba(255,215,0,0.04);
  }

  .channel .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="icon">&#9749;</div>
    <h1>Be Right Back</h1>
    <p class="subtitle">Taking a quick break - don't go anywhere!</p>
    <div class="channel">
      <span class="name">&#9824; viviputz</span>
    </div>
  </div>
</body>
</html>
