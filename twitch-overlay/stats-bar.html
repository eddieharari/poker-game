<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .bar {
    display: inline-flex;
    align-items: center;
    gap: 0;
    background: linear-gradient(135deg, rgba(26,26,46,0.92) 0%, rgba(11,12,16,0.95) 100%);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 16px;
    padding: 0;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 12px rgba(255,215,0,0.1);
    overflow: hidden;
  }

  .logo {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: linear-gradient(135deg, rgba(255,215,0,0.12) 0%, rgba(255,107,0,0.08) 100%);
    border-right: 1px solid rgba(255,215,0,0.2);
  }

  .logo .icon { font-size: 18px; }

  .logo .channel {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #FFD700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stat {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 18px;
    border-right: 1px solid rgba(255,255,255,0.06);
    min-width: 80px;
  }

  .stat:last-child { border-right: none; }

  .stat .label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2px;
  }

  .stat .value {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #E0E6ED;
  }

  .stat .value.positive { color: #00FF9D; }
  .stat .value.negative { color: #FF3366; }
  .stat .value.neutral  { color: #FFD700; }

  .stat .value .unit {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.5;
    margin-left: 2px;
  }

  .platform {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.02);
    border-left: 1px solid rgba(255,255,255,0.06);
  }

  .platform .badge {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    padding: 3px 8px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="bar">
  <div class="logo">
    <span class="icon">&#9824;</span>
    <span class="channel">viviputz</span>
  </div>

  <div class="stat">
    <span class="label">Hands</span>
    <span class="value" id="hands">0</span>
  </div>

  <div class="stat">
    <span class="label">Session</span>
    <span class="value neutral" id="profit">$0</span>
  </div>

  <div class="stat">
    <span class="label">Time</span>
    <span class="value" id="timer">00:00</span>
  </div>

  <div class="stat">
    <span class="label">VPIP</span>
    <span class="value" id="vpip">0<span class="unit">%</span></span>
  </div>

  <div class="platform">
    <span class="badge">GGPoker</span>
  </div>
</div>

<script>
  // ── Session Timer ──
  const startTime = Date.now();
  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const h = Math.floor(elapsed / 3600);
    const m = Math.floor((elapsed % 3600) / 60);
    const s = elapsed % 60;
    const el = document.getElementById('timer');
    el.textContent = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  setInterval(updateTimer, 1000);

  // ── Manual stat updates ──
  // Call these from OBS browser source console or via URL params
  // Example: updateStats({ hands: 42, profit: 150, vpip: 23 })
  window.updateStats = function(data) {
    if (data.hands !== undefined) {
      document.getElementById('hands').textContent = data.hands;
    }
    if (data.profit !== undefined) {
      const el = document.getElementById('profit');
      const val = data.profit;
      el.textContent = (val >= 0 ? '+$' : '-$') + Math.abs(val);
      el.className = 'value ' + (val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral');
    }
    if (data.vpip !== undefined) {
      document.getElementById('vpip').innerHTML = data.vpip + '<span class="unit">%</span>';
    }
    if (data.platform !== undefined) {
      document.querySelector('.badge').textContent = data.platform;
    }
  };

  // Load from URL params on init
  const params = new URLSearchParams(window.location.search);
  if (params.get('platform')) {
    document.querySelector('.badge').textContent = params.get('platform');
  }
</script>
</body>
</html>
