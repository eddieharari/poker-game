<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 500px; height: 120px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .alert {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 28px;
    background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(11,12,16,0.95) 100%);
    border: 2px solid #FFD700;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(255,215,0,0.3), 0 8px 32px rgba(0,0,0,0.5);
    transform: translateY(100px);
    opacity: 0;
    animation: slideIn 0.5s ease-out forwards, slideOut 0.5s ease-in 4.5s forwards;
  }

  @keyframes slideIn {
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideOut {
    to { transform: translateY(-100px); opacity: 0; }
  }

  .alert .icon { font-size: 36px; }

  .alert .text {
    display: flex; flex-direction: column; gap: 2px;
  }

  .alert .label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    color: #FFD700;
  }

  .alert .message {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 700;
    color: #fff;
  }

  .alert .highlight { color: #00FF9D; }
</style>
</head>
<body>
  <div class="alert" id="alert">
    <span class="icon" id="icon">&#127183;</span>
    <div class="text">
      <span class="label" id="label">Big Win</span>
      <span class="message" id="message">Won a <span class="highlight">$500</span> pot!</span>
    </div>
  </div>

<script>
  // Trigger via URL params: ?icon=&label=Big+Win&message=Won+a+$500+pot!
  const params = new URLSearchParams(window.location.search);
  if (params.get('icon'))    document.getElementById('icon').textContent = decodeURIComponent(params.get('icon'));
  if (params.get('label'))   document.getElementById('label').textContent = params.get('label');
  if (params.get('message')) document.getElementById('message').innerHTML = params.get('message');
</script>
</body>
</html>
